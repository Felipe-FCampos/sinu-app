<p class="filter-title">Faça sua busca</p>
<div class="filter-container">
    <input type="text" placeholder="Buscar por nome..." [(ngModel)]="searchTerm" (input)="onSearchChange()" />

    <!-- O botão de filtros agora é o único botão aqui -->
    @if (statusOptions.length > 0 || showSortButton) {
    <button class="filter-button" (click)="openFilters()">
        <!-- Mostra o ícone de FILTRO se o painel estiver fechado -->
        @if (!isFilterPanelOpen) {
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#ffffff">
            <path d="M0 0h24v24H0V0z" fill="none" />
            <path
                d="M11 18h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM3 7c0 .55.45 1 1 1h16c.55 0 1-.45 1-1s-.45-1-1-1H4c-.55 0-1 .45-1 1zm4 6h10c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1z" />
        </svg>
        }
        <!-- Mostra o ícone de FECHAR (X) se o painel estiver aberto -->
        @if (isFilterPanelOpen) {
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#ffffff">
            <path d="M0 0h24v24H0V0z" fill="none" />
            <path
                d="M18.3 5.71c-.39-.39-1.02-.39-1.41 0L12 10.59 7.11 5.7c-.39-.39-1.02-.39-1.41 0-.39.39-.39 1.02 0 1.41L10.59 12 5.7 16.89c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0L12 13.41l4.89 4.89c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4z" />
        </svg>
        }
    </button>
    }
</div>

<!-- O container de filtros agora usa a propriedade 'isFilterPanelOpen' -->
@if ((statusOptions.length > 0 || showSortButton) && isFilterPanelOpen) {
<div id="div-filters">

    <!-- Seção de Filtro por Status -->
    @if (statusOptions.length > 0) {
    <div class="filter-section">
        <p>Filtrar por Status:</p>
        <div class="status-filter-options">
            @for (option of statusOptions; track option.value) {
            <label>
                <input type="checkbox" [name]="option.value" [(ngModel)]="selectedStatuses[option.value]"
                    (change)="onStatusChange()">
                <span>{{ option.label }}</span>
            </label>
            }
        </div>
    </div>
    }

    <!-- Seção de Ordenação (Nova Posição) -->
    @if (showSortButton) {
    <div class="filter-section">
        <p>Ordenar:</p>
        <div class="sort-options">
            <label>
                <input type="checkbox" [ngModel]="isSorted" (change)="onSortClick()">
                <span>Por data de vencimento</span>
            </label>
        </div>
    </div>
    }
</div>
<hr class="divider"/>
}
