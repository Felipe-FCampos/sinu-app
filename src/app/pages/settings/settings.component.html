<section class="settings-page">
    <div class="section-user-info-settings">
        @if (isLoading) {
        <div class="loader-container">
            <div class="spinner"></div>
        </div>
        } @else if (user) {
        <div class="user-info-settings">
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 20 20" height="64px"
                    viewBox="0 0 20 20" width="64px" fill="#d3d3d3">
                    <g>
                        <rect fill="none" height="20" width="20" />
                    </g>
                    <g>
                        <g>
                            <path
                                d="M10 2c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 3.5c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 11c-2.05 0-3.87-.95-5.07-2.44 1.45-.98 3.19-1.56 5.07-1.56s3.62.58 5.07 1.56c-1.2 1.49-3.02 2.44-5.07 2.44z" />
                        </g>
                    </g>
                </svg>
            </div>
            <div class="user-details-settings">
                <p>{{ user.name }}</p>
                <p>{{ user.email }}</p>
            </div>
        </div>
        }
    </div>
    <a routerLink="/profile" class="settings-button">
        <p>
            <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960" width="16px" fill="#2c2c2c">
                <path
                    d="M185-80q-17 0-29.5-12.5T143-122v-105q0-90 56-159t144-88q-40 28-62 70.5T259-312v190q0 11 3 22t10 20h-87Zm147 0q-17 0-29.5-12.5T290-122v-190q0-70 49.5-119T459-480h189q70 0 119 49t49 119v64q0 70-49 119T648-80H332Zm148-484q-66 0-112-46t-46-112q0-66 46-112t112-46q66 0 112 46t46 112q0 66-46 112t-112 46Z" />
            </svg>
            Perfil
        </p>
        <svg class="arrow-settings" xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 0 24 24" width="16px"
            fill="#2c2c2c">
            <path d="M0 0h24v24H0V0z" fill="none" opacity=".87" />
            <path
                d="M16.62 2.99c-.49-.49-1.28-.49-1.77 0L6.54 11.3c-.39.39-.39 1.02 0 1.41l8.31 8.31c.49.49 1.28.49 1.77 0s.49-1.28 0-1.77L9.38 12l7.25-7.25c.48-.48.48-1.28-.01-1.76z" />
        </svg>
    </a>
    <a routerLink="/profile" class="settings-button">
        <p>
            <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 0 24 24" width="16px" fill="#2c2c2c">
                <path d="M0 0h24v24H0V0z" fill="none" />
                <path
                    d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84l3.96-5.58c.25-.35.25-.81 0-1.16l-3.96-5.58z" />
            </svg>
            Categorias
        </p>
        <svg class="arrow-settings" xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 0 24 24" width="16px"
            fill="#2c2c2c">
            <path d="M0 0h24v24H0V0z" fill="none" opacity=".87" />
            <path
                d="M16.62 2.99c-.49-.49-1.28-.49-1.77 0L6.54 11.3c-.39.39-.39 1.02 0 1.41l8.31 8.31c.49.49 1.28.49 1.77 0s.49-1.28 0-1.77L9.38 12l7.25-7.25c.48-.48.48-1.28-.01-1.76z" />
        </svg>
    </a>
    <a routerLink="/profile" class="settings-button danger-zone">
        <p>
            <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 0 24 24" width="16px" fill="#f9f9f9">
                <path
                    d="M12 5.99 19.53 19H4.47L12 5.99M2.74 18c-.77 1.33.19 3 1.73 3h15.06c1.54 0 2.5-1.67 1.73-3L13.73 4.99c-.77-1.33-2.69-1.33-3.46 0L2.74 18zM11 11v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zm0 5h2v2h-2z" />
            </svg>
            Ações avançadas da conta
        </p>
        <svg class="arrow-settings" xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 0 24 24" width="16px"
            fill="#f9f9f9">
            <path d="M0 0h24v24H0V0z" fill="none" opacity=".87" />
            <path
                d="M16.62 2.99c-.49-.49-1.28-.49-1.77 0L6.54 11.3c-.39.39-.39 1.02 0 1.41l8.31 8.31c.49.49 1.28.49 1.77 0s.49-1.28 0-1.77L9.38 12l7.25-7.25c.48-.48.48-1.28-.01-1.76z" />
        </svg>
    </a>
</section>
