<div class="profile-container">
    <div class="profile-card">
        <a class="back-button-profile" href="/settings">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#2c2c2c"><path d="M0 0h24v24H0V0z" fill="none" opacity=".87"/><path d="M16.62 2.99c-.49-.49-1.28-.49-1.77 0L6.54 11.3c-.39.39-.39 1.02 0 1.41l8.31 8.31c.49.49 1.28.49 1.77 0s.49-1.28 0-1.77L9.38 12l7.25-7.25c.48-.48.48-1.28-.01-1.76z"/></svg>
        </a>
        <div class="user-info">
            @if (user) {
            <div class="user-icon">
                <svg xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 20 20" height="48px"
                    viewBox="0 0 20 20" width="48px" fill="#fff">
                    <g>
                        <rect fill="none" height="20" width="20" />
                    </g>
                    <g>
                        <g>
                            <path
                                d="M10 2c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 3.5c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 11c-2.05 0-3.87-.95-5.07-2.44 1.45-.98 3.19-1.56 5.07-1.56s3.62.58 5.07 1.56c-1.2 1.49-3.02 2.44-5.07 2.44z" />
                        </g>
                    </g>
                </svg>
                <span>
                    <p>{{ user.name }}</p>
                </span>
            </div>
            <span>
                <p>{{ user.email }}</p>
            </span>
            <span class="account-created-at">
                <p>Criado em: </p>
                <p>{{ user.createdAt | date: 'short' }}</p>
            </span>
            }
        </div>
        <div class="profile-actions">
            <button (click)="logout()" class="logout-button">
                Sair
            </button>
        </div>
    </div>
</div>
